name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  production_preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-04-08
      - name: Verify release tag comes from dev
        run: |
          set -euo pipefail
          git describe --tags --exact-match HEAD | grep -Fx "$GITHUB_REF_NAME"
          git fetch origin dev --tags --force
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev || {
            echo "::error::release tag $GITHUB_REF_NAME must point to a commit reachable from dev"
            exit 1
          }
      - name: Verify Turso Fly runtime secrets
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          secret_table="$(flyctl secrets list --app trendinary)"
          for required in TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            if ! printf '%s\n' "$secret_table" | grep -Fq "$required"; then
              echo "::error::Missing Fly secret ${required}. Configure Turso before releasing."
              exit 1
            fi
          done
      - name: Plan production migrations inside Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bash scripts/run-goose-fly-machine.sh plan

  release:
    needs: production_preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.0"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify supply-chain policy
        run: bash scripts/verify-supply-chain.sh
      - name: Verify dependency vulnerabilities
        run: npm run security
      - name: Validate release metadata
        id: release_meta
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$VERSION_VALUE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION must contain SemVer without a v prefix"
            exit 1
          fi
          if [ "$VERSION_VALUE" != "$PACKAGE_VERSION" ]; then
            echo "::error::VERSION ($VERSION_VALUE) and package.json ($PACKAGE_VERSION) must match"
            exit 1
          fi
          TAG="v$VERSION_VALUE"
          if [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION/package.json ($TAG)"
            exit 1
          fi
          git describe --tags --exact-match HEAD | grep -Fx "$TAG"
          if ! grep -Eq "^## \[$VERSION_VALUE\]( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [$VERSION_VALUE] release section"
            exit 1
          fi
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Verify Go module lock files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify local release gate
        run: npm run verify:local
      - name: Verify real libSQL and two-process Docker topology
        run: npm run test:libsql
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify production Docker image in browser
        run: npm run test:e2e:docker
      - name: Extract changelog release notes
        env:
          VERSION_VALUE: ${{ steps.release_meta.outputs.version }}
        run: |
          awk -v version="$VERSION_VALUE" '
            $0 ~ "^## \\[" version "\\]" {found=1; next}
            found && $0 ~ /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No release notes found for $VERSION_VALUE"
            exit 1
          fi
      - name: Create GitHub Release when needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          VERSION_VALUE: ${{ steps.release_meta.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG GitHub Release already exists"
            exit 0
          fi
          args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md --verify-tag)
          if [[ "$VERSION_VALUE" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
