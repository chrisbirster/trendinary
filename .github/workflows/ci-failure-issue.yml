name: CI failure to issue

on:
  workflow_run:
    workflows: ["CI", "Deploy production", "Production smoke", "Release", "Branch flow"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `CI failure: ${run.name} on ${run.head_branch}`;
            const body = [
              `Workflow **${run.name}** failed on \`${run.head_branch}\`.`,
              ``,
              `- Run: ${run.html_url}`,
              `- Commit: ${run.head_sha}`,
              `- Event: ${run.event}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
