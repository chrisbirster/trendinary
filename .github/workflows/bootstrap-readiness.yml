name: Bootstrap v1 readiness implementation

on:
  push:
    branches: [feature/v1-readiness]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[readiness-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.0"
          cache-dependency-path: go.sum
      - name: Apply and verify readiness patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bootstrap-readiness.py
          gofmt -w internal/buildinfo/info.go internal/buildinfo/info_test.go internal/history/readiness.go internal/httpapi/server.go internal/httpapi/server_test.go
          bash -n .github/scripts/production-smoke.sh
          go test ./internal/buildinfo ./internal/history ./internal/httpapi
      - name: Commit verified non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/bootstrap-readiness.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "feat: add DB-aware readiness and runtime release identity [readiness-generated]"
          git push
