name: v0.6.3 runtime liveness bootstrap

on:
  push:
    branches: [hotfix/v0.6.3-runtime-liveness]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hotfix/v0.6.3-runtime-liveness
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.0"
      - name: Apply runtime-liveness fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          v2 = Path("internal/scanner/v2.go")
          text = v2.read_text()
          old = "seedClusters := strongestClusters(candidates, maxCandidateClusters)"
          new = "seedClusters := strongestClusters(candidates, topCandidateProcessingLimit(s.config.PublishedTrendLimit))"
          if old not in text:
              raise SystemExit("v2 candidate-selection call not found")
          v2.write_text(text.replace(old, new, 1))

          Path("internal/scanner/candidate_budget.go").write_text('''package scanner\n\n// topCandidateProcessingLimit bounds expensive durable scoring work relative to\n// the number of trends we can actually publish. The pre-score candidate weight\n// still considers every discovered cluster; only the strongest shortlist pays\n// for entity resolution, rolling evidence, baselines, propagation, snapshots,\n// and chart history over remote libSQL.\nfunc topCandidateProcessingLimit(published int) int {\n\tif published <= 0 {\n\t\tpublished = 20\n\t}\n\tlimit := published * 2\n\tif limit > maxCandidateClusters {\n\t\treturn maxCandidateClusters\n\t}\n\treturn limit\n}\n''')

          Path("internal/scanner/candidate_budget_test.go").write_text('''package scanner\n\nimport "testing"\n\nfunc TestTopCandidateProcessingLimitKeepsRankingHeadroomWithoutScoringOneHundredClusters(t *testing.T) {\n\tif got := topCandidateProcessingLimit(20); got != 40 {\n\t\tt.Fatalf("default Top 20 processing limit = %d, want 40", got)\n\t}\n\tif got := topCandidateProcessingLimit(10); got != 20 {\n\t\tt.Fatalf("Top 10 processing limit = %d, want 20", got)\n\t}\n\tif got := topCandidateProcessingLimit(75); got != maxCandidateClusters {\n\t\tt.Fatalf("large processing limit = %d, want cap %d", got, maxCandidateClusters)\n\t}\n}\n''')

          collector = Path("internal/ingest/jetstream/collector.go")
          text = collector.read_text()
          old_sig = "func (c *Collector) watchLiveProgress(ctx context.Context, client *bskyjetstream.Client, connectedAt time.Time, stop <-chan struct{}, stalled chan<- struct{}, done chan<- struct{}) {"
          new_sig = "func (c *Collector) watchLiveProgress(ctx context.Context, cancel context.CancelFunc, client *bskyjetstream.Client, connectedAt time.Time, stop <-chan struct{}, stalled chan<- struct{}, done chan<- struct{}) {"
          if old_sig not in text:
              raise SystemExit("watchLiveProgress signature not found")
          text = text.replace(old_sig, new_sig, 1)

          old_close = "\t\t\t_ = client.Close()\n\t\t\treturn\n"
          new_close = "\t\t\trecycleStalledSubscription(cancel, client)\n\t\t\treturn\n"
          if old_close not in text:
              raise SystemExit("watchdog close path not found")
          text = text.replace(old_close, new_close, 1)

          marker = "// watchLiveProgress closes a live client when the socket remains connected but\n"
          helper = '''func recycleStalledSubscription(cancel context.CancelFunc, client *bskyjetstream.Client) {\n\t// Closing the Jetstream client alone is not guaranteed to unblock the\n\t// library's Events iterator. Cancelling the per-subscription context is the\n\t// authoritative interrupt; Close remains best-effort transport cleanup.\n\tif cancel != nil {\n\t\tcancel()\n\t}\n\tif client != nil {\n\t\t_ = client.Close()\n\t}\n}\n\n'''
          if marker not in text:
              raise SystemExit("watchdog comment marker not found")
          text = text.replace(marker, helper + marker, 1)

          old_connected = "\t\tconnectedAt := time.Now().UTC()\n\t\tc.config.Status.StreamConnected(c.config.Host)"
          new_connected = "\t\tstreamCtx, streamCancel := context.WithCancel(ctx)\n\t\tconnectedAt := time.Now().UTC()\n\t\tc.config.Status.StreamConnected(c.config.Host)"
          if old_connected not in text:
              raise SystemExit("connected block not found")
          text = text.replace(old_connected, new_connected, 1)

          old_go = "go c.watchLiveProgress(ctx, client, connectedAt, watchdogStop, watchdogStalled, watchdogDone)"
          new_go = "go c.watchLiveProgress(streamCtx, streamCancel, client, connectedAt, watchdogStop, watchdogStalled, watchdogDone)"
          if old_go not in text:
              raise SystemExit("watchdog launch not found")
          text = text.replace(old_go, new_go, 1)

          old_events = "for batch, streamErr := range client.Events(ctx) {"
          new_events = "for batch, streamErr := range client.Events(streamCtx) {"
          if old_events not in text:
              raise SystemExit("Events iterator not found")
          text = text.replace(old_events, new_events, 1)

          # Every branch that owns a live subscription must release its child
          # context before closing/returning. Context cancellation is idempotent.
          text = text.replace(
              "\t\t\t\t\tclose(watchdogStop)\n\t\t\t\t\t<-watchdogDone\n\t\t\t\t\t_ = client.Close()\n\t\t\t\t\treturn fmt.Errorf(\"%w: %v\", ErrFatal, streamErr)",
              "\t\t\t\t\tclose(watchdogStop)\n\t\t\t\t\t<-watchdogDone\n\t\t\t\t\tstreamCancel()\n\t\t\t\t\t_ = client.Close()\n\t\t\t\t\treturn fmt.Errorf(\"%w: %v\", ErrFatal, streamErr)",
              1,
          )
          text = text.replace(
              "\t\t\t\tclose(watchdogStop)\n\t\t\t\t<-watchdogDone\n\t\t\t\t_ = client.Close()\n\t\t\t\treturn err",
              "\t\t\t\tclose(watchdogStop)\n\t\t\t\t<-watchdogDone\n\t\t\t\tstreamCancel()\n\t\t\t\t_ = client.Close()\n\t\t\t\treturn err",
              1,
          )
          old_cleanup = "\t\tclose(watchdogStop)\n\t\t<-watchdogDone\n\t\t_ = client.Close()"
          new_cleanup = "\t\tclose(watchdogStop)\n\t\t<-watchdogDone\n\t\tstreamCancel()\n\t\t_ = client.Close()"
          if old_cleanup not in text:
              raise SystemExit("subscription cleanup not found")
          text = text.replace(old_cleanup, new_cleanup, 1)
          collector.write_text(text)

          test = Path("internal/ingest/jetstream/watchdog_test.go")
          text = test.read_text()
          old_import = 'import (\n\t"testing"\n\t"time"'
          new_import = 'import (\n\t"context"\n\t"testing"\n\t"time"'
          if old_import not in text:
              raise SystemExit("watchdog test import block not found")
          text = text.replace(old_import, new_import, 1)
          text += '''\nfunc TestRecycleStalledSubscriptionCancelsEventIteratorContext(t *testing.T) {\n\tctx, cancel := context.WithCancel(context.Background())\n\trecycleStalledSubscription(cancel, nil)\n\tselect {\n\tcase <-ctx.Done():\n\tdefault:\n\t\tt.Fatal("stalled subscription must cancel its Events context")\n\t}\n}\n'''
          test.write_text(text)
          PY

          gofmt -w \
            internal/scanner/v2.go \
            internal/scanner/candidate_budget.go \
            internal/scanner/candidate_budget_test.go \
            internal/ingest/jetstream/collector.go \
            internal/ingest/jetstream/watchdog_test.go

          go test ./internal/scanner ./internal/ingest/jetstream

          rm .github/workflows/v0.6.3-runtime-liveness-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix production scanner and Jetstream liveness"
          git push origin HEAD:hotfix/v0.6.3-runtime-liveness
