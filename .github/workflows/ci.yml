name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - name: Resolve Go modules
        run: go mod tidy
      - name: Upload resolved Go lock files
        uses: actions/upload-artifact@v4
        with:
          name: resolved-go-lock-files
          path: |
            go.mod
            go.sum
          if-no-files-found: error
      - name: Verify Go module lock files
        run: git diff --exit-code -- go.mod go.sum
      - run: npm run verify
      - run: docker build -t trendinary:ci .
