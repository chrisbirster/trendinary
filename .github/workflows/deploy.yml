name: Deploy production

on:
  workflow_call:
    inputs:
      tag:
        description: "Published Trendinary release tag to deploy"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published release tag to redeploy (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify published release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::$RELEASE_TAG is not a Trendinary SemVer tag"
            exit 1
          fi
          git describe --tags --exact-match HEAD | grep -Fx "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "v$FILE_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::tag $RELEASE_TAG does not match VERSION ($FILE_VERSION)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: npm install
      - name: Verify persistent Fly volume
        run: |
          if ! flyctl volumes list --app trendinary | grep -q "trendinary_data"; then
            echo "::error::Missing Fly volume trendinary_data. Create it once with: flyctl volumes create trendinary_data --app trendinary --region iad --size 1"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy Go origin to Fly.io
        run: npm run deploy:fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Install SST providers
        run: npx sst install
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      - name: Deploy Cloudflare edge and DNS
        run: npm run infra:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
