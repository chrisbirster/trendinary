name: Deploy production

on:
  workflow_call:
    inputs:
      tag:
        description: "Published Trendinary release tag to deploy"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published release tag to redeploy (for example v0.5.7)"
        required: true
        type: string

permissions:
  contents: read

# A single production schema/deploy sequence may run at a time. Atlas finishes
# before Fly is touched, so application machines never race each other on DDL.
concurrency:
  group: trendinary-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify published release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::$RELEASE_TAG is not a Trendinary SemVer tag"
            exit 1
          fi
          git describe --tags --exact-match HEAD | grep -Fx "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "v$FILE_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::tag $RELEASE_TAG does not match VERSION ($FILE_VERSION)"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-04-08
      - run: npm ci
      - name: Verify supply-chain policy
        run: bash scripts/verify-supply-chain.sh
      - name: Verify Turso migration credentials
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TURSO_DATABASE_URL" || { echo "::error::Missing production TURSO_DATABASE_URL GitHub environment secret"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "::error::Missing production TURSO_AUTH_TOKEN GitHub environment secret"; exit 1; }
      - name: Verify Turso Fly runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_table="$(flyctl secrets list --app trendinary)"
          for required in TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            if ! printf '%s\n' "$secret_table" | grep -Fq "$required"; then
              echo "::error::Missing Fly secret ${required}. Configure Turso before releasing."
              exit 1
            fi
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Re-plan production schema and enforce expand-only policy
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          atlas schema apply --env production --dry-run 2>&1 | tee atlas-plan.sql
          python3 scripts/verify-atlas-plan.py atlas-plan.sql
      - name: Apply database schema with Atlas
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          atlas schema apply --env production --auto-approve
      - name: Deploy Go origin to Fly.io
        run: |
          set -euo pipefail
          BUILD_SHA="$(git rev-parse HEAD)"
          npm run deploy:fly -- \
            --build-arg "TRENDINARY_RELEASE=$RELEASE_TAG" \
            --build-arg "TRENDINARY_COMMIT_SHA=$BUILD_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Install SST providers
        run: npx sst install
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      - name: Deploy Cloudflare edge and DNS
        run: npm run infra:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      - name: Smoke public production API
        run: |
          TRENDINARY_EXPECTED_RELEASE="$RELEASE_TAG" \
          TRENDINARY_EXPECTED_COMMIT="$(git rev-parse HEAD)" \
          bash .github/scripts/production-smoke.sh
