app = "trendinary"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TRENDINARY_REQUIRE_TURSO = "1"
  TRENDINARY_RESET_DATABASE_ID = "2026-09-07-v0.5.4-clean-slate"
  TRENDINARY_SCAN_INTERVAL = "2m"
  TRENDINARY_HN_LIMIT = "30"
  TRENDINARY_ENRICH_CLUSTERS = "8"
  TRENDINARY_BLUESKY_LIMIT = "20"
  TRENDINARY_TREND_LIMIT = "20"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "8s"
    method = "GET"
    path = "/api/v1/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
